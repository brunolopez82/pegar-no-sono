name: Build e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Definidos em Settings > Secrets and variables > Actions.
      # Sem eles, o passo de FTP e' saltado e o site nao e' atualizado.
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build          # output:'export' gera o HTML estatico em out/

      # Guarda o HTML que ja estava publicado, para saber a seguir o que mudou
      # mesmo. Se o branch ainda nao existir (primeiro deploy), segue sem ele.
      - name: Buscar a versao publicada
        continue-on-error: true
        run: |
          git fetch origin deploy --depth=1 || exit 0
          mkdir -p anterior
          git --work-tree=anterior checkout origin/deploy -- . || true

      # O branch deploy deixou de ser o que alimenta o alojamento e passa a ser
      # o registo do que foi publicado: serve para comparar versoes, para o
      # calculo do IndexNow, e para repor a mao se for preciso.
      - name: Guardar o build no branch deploy
        run: |
          cd out
          touch .nojekyll
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Build de ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy

      # Envia o site para a Hostinger por FTP.
      #
      # Porque FTP e nao a integracao Git da Hostinger: essa faz um build
      # proprio do repositorio, o que nao faz sentido aqui — quem compila e'
      # esta Action, e o alojamento so precisa de receber HTML. A integracao
      # Git tambem nunca apagou ficheiros de versoes antigas, e foram esses que
      # andaram a devolver 500 em /artigos/<slug-inexistente>/.
      #
      # Esta accao guarda no servidor um ficheiro de estado e envia apenas o
      # que mudou, apagando o que deixou de existir.
      - name: Enviar para a Hostinger por FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS explicito, na mesma porta 21. Em FTP simples as credenciais
          # viajam em texto claro. Se a Hostinger recusar o TLS, o passo falha
          # com erro de certificado ou de AUTH — nesse caso, e so' nesse caso,
          # trocar para "ftp".
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: /public_html/
          # UMA VEZ SO'. Apaga tudo no servidor antes de enviar, para varrer os
          # ficheiros de instalacoes anteriores que sobreviveram a todos os
          # deploys e que devolviam 500 em /artigos/<slug-inexistente>/.
          # Tirar esta linha logo a seguir: com ela ligada, cada publicacao
          # apaga o site inteiro antes de o repor, e isso e' downtime a toa.
          dangerous-clean-slate: true
          # O .git do out/ e' um artefacto do passo anterior, nao pertence ao site.
          exclude: |
            **/.git*
            **/.git*/**

      - name: Avisar que faltam os segredos de FTP
        if: env.FTP_SERVER == ''
        run: |
          echo "::warning::FTP_SERVER nao esta definido. O build foi guardado no branch deploy mas o site nao foi atualizado."
          echo "Defina FTP_SERVER, FTP_USERNAME e FTP_PASSWORD em Settings > Secrets and variables > Actions."

      # Avisa o Bing (e Yandex, Seznam, Naver). O Google nao usa IndexNow.
      #
      # Submete SO as paginas cujo HTML mudou desde o deploy anterior. As
      # guidelines do Bing desaconselham submissoes em lote e contam a
      # re-submissao de paginas iguais como desperdicio de rastreio.
      #
      # Nunca pode partir o deploy: o site ja esta publicado neste ponto.
      - name: Avisar o IndexNow do que mudou
        if: env.FTP_SERVER != ''
        continue-on-error: true
        env:
          CHAVE: e21db589dfd8f6a4b157daf462a26e93
        run: |
          : > mudaram.txt
          for f in $(cd out && find . -name index.html); do
            caminho=${f#./}
            url="https://pegarnosono.com/${caminho%index.html}"
            antigo="anterior/$caminho"
            if [ ! -f "$antigo" ] || ! cmp -s "out/$caminho" "$antigo"; then
              echo "$url" >> mudaram.txt
            fi
          done

          total=$(wc -l < mudaram.txt)
          echo "Paginas alteradas neste deploy: $total"
          cat mudaram.txt

          if [ "$total" -eq 0 ]; then
            echo "Nada mudou no HTML. Nao ha nada a submeter."
            exit 0
          fi

          jq -Rn --arg k "$CHAVE" '{host: "pegarnosono.com", key: $k, keyLocation: ("https://pegarnosono.com/" + $k + ".txt"), urlList: [inputs]}' < mudaram.txt > corpo.json
          codigo=$(curl -s -o resposta.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data-binary @corpo.json https://api.indexnow.org/indexnow)
          echo "IndexNow devolveu HTTP $codigo"
          cat resposta.txt

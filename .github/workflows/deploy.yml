name: Build e publicar no branch deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build          # output:'export' gera o HTML estatico em out/

      # Guarda o HTML que ja estava publicado, para saber a seguir o que mudou
      # mesmo. Se o branch ainda nao existir (primeiro deploy), segue sem ele.
      - name: Buscar a versao publicada
        continue-on-error: true
        run: |
          git fetch origin deploy --depth=1 || exit 0
          mkdir -p anterior
          git --work-tree=anterior checkout origin/deploy -- . || true

      # Publica APENAS o HTML compilado no branch "deploy".
      # A Hostinger fica ligada a esse branch, nunca ao main.
      - name: Publicar no branch deploy
        run: |
          cd out
          touch .nojekyll
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Build de ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy

      # Avisa o Bing (e Yandex, Seznam, Naver). O Google nao usa IndexNow.
      #
      # Submete SO as paginas cujo HTML mudou desde o deploy anterior. As
      # guidelines do Bing desaconselham submissoes em lote e contam a
      # re-submissao de paginas iguais como desperdicio de rastreio: com um
      # artigo novo por semana, mandar o site inteiro de cada vez seria pedir
      # ao Bing para reler noventa e nove paginas que nao mexeram.
      #
      # Sem versao anterior (primeiro deploy), submete tudo — a e' correcto.
      #
      # Nunca pode partir o deploy: o site ja esta publicado neste ponto.
      #
      # A chave tem de ser a mesma que esta em public/<chave>.txt.
      - name: Avisar o IndexNow do que mudou
        continue-on-error: true
        env:
          CHAVE: e21db589dfd8f6a4b157daf462a26e93
        run: |
          : > mudaram.txt
          for f in $(cd out && find . -name index.html); do
            caminho=${f#./}
            url="https://pegarnosono.com/${caminho%index.html}"
            antigo="anterior/$caminho"
            if [ ! -f "$antigo" ] || ! cmp -s "out/$caminho" "$antigo"; then
              echo "$url" >> mudaram.txt
            fi
          done

          total=$(wc -l < mudaram.txt)
          echo "Paginas alteradas neste deploy: $total"
          cat mudaram.txt

          if [ "$total" -eq 0 ]; then
            echo "Nada mudou no HTML. Nao ha nada a submeter."
            exit 0
          fi

          jq -Rn --arg k "$CHAVE" '{host: "pegarnosono.com", key: $k, keyLocation: ("https://pegarnosono.com/" + $k + ".txt"), urlList: [inputs]}' < mudaram.txt > corpo.json
          codigo=$(curl -s -o resposta.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data-binary @corpo.json https://api.indexnow.org/indexnow)
          echo "IndexNow devolveu HTTP $codigo"
          cat resposta.txt
          # 200 = aceite. 202 = aceite, a validar a chave. 403 = a chave nao bate
          # com o ficheiro em public/. 422 = URL fora do dominio declarado.

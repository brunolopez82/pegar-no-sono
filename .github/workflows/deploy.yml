name: Build e publicar no branch deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build          # output:'export' gera o HTML estatico em out/

      # Publica APENAS o HTML compilado no branch "deploy".
      # A Hostinger fica ligada a esse branch, nunca ao main.
      - name: Publicar no branch deploy
        run: |
          cd out
          touch .nojekyll
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Build de ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy

      # Avisa o Bing (e Yandex, Seznam, Naver) de que o site mudou, em vez de
      # esperar que passem por aqui. O Google nao usa IndexNow: esse descobre
      # pelo sitemap.
      #
      # Corre depois de publicar, para nunca anunciar conteudo que ainda nao
      # esta no ar. O out/ continua acessivel; o passo anterior so entrou la
      # dentro, nao o apagou.
      #
      # Nunca pode partir o deploy: um ping falhado a um motor de busca nao e
      # motivo para marcar a build como vermelha.
      #
      # A chave tem de ser a mesma que esta em public/<chave>.txt.
      - name: Avisar o IndexNow
        continue-on-error: true
        env:
          CHAVE: e21db589dfd8f6a4b157daf462a26e93
        run: |
          grep -o '<loc>[^<]*</loc>' out/sitemap.xml | sed 's|<loc>||; s|</loc>||' > urls.txt
          echo "URLs no sitemap: $(wc -l < urls.txt)"
          jq -Rn --arg k "$CHAVE" '{host: "pegarnosono.com", key: $k, keyLocation: ("https://pegarnosono.com/" + $k + ".txt"), urlList: [inputs]}' < urls.txt > corpo.json
          codigo=$(curl -s -o resposta.txt -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data-binary @corpo.json https://api.indexnow.org/indexnow)
          echo "IndexNow devolveu HTTP $codigo"
          cat resposta.txt
          # 200 = aceite. 202 = aceite, a validar a chave. 403 = a chave nao bate
          # com o ficheiro em public/. 422 = URL fora do dominio declarado.
